<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

<style>
html, body {
    margin: 0;
    height: 100%;
}

object {
    width: 100%;
    height: 100vh;
}
</style>

</head>

<body>

<object id="svg" data="Diseño.svg" type="image/svg+xml"></object>

<script>
window.onload = () => {
    svgPanZoom('#svg', {
        zoomEnabled: true,
        controlIconsEnabled: true,
        fit: true,
        center: true
    });
};
</script>

</body>
</html>
